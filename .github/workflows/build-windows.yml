name: Build Windows installer

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # electron-builder SOLO compila aquí (--publish never): dejarlo publicar directo a GitHub
      # (--publish always) es lo que causaba releases duplicados con el mismo tag (el .exe+latest.yml
      # por un lado y el .blockmap solo por otro) — sube cada archivo con su propia llamada a la API
      # y, si hay carrera entre ellas, cada una puede terminar creando su propio Release. Publicar en
      # un paso aparte y atómico (más abajo) resuelve esto de raíz.
      - name: Compilar
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run build && npx electron-builder --win --publish never

      - name: Compilar sin publicar (ejecución manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: bellora-dashboard-windows
          path: release/*.exe

      # Barrera REL-M1 (incidente v0.2.0): latest.yml anunciaba un nombre con guiones y GitHub guardó
      # el .exe con puntos, así que el auto-update recibía 404. Antes de publicar, el nombre que anuncia
      # latest.yml debe ser seguro para GitHub (no lo renombra) y existir tal cual en release/, junto
      # con su .blockmap; y el tag debe coincidir con la versión de package.json (REL-B3).
      - name: Verificar latest.yml contra los archivos a publicar
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $yml  = Get-Content release/latest.yml -Raw
          $path = [regex]::Match($yml, '(?m)^path:\s*(.+)$').Groups[1].Value.Trim()
          $url  = [regex]::Match($yml, '(?m)^\s*-\s*url:\s*(.+)$').Groups[1].Value.Trim()
          if ($path -ne $url) { throw "latest.yml: path ($path) != files[0].url ($url)" }
          if ($path -notmatch '^[0-9A-Za-z._-]+$') { throw "Nombre no seguro para GitHub Releases: $path" }
          foreach ($f in @("release/$path", "release/$path.blockmap")) {
            if (-not (Test-Path -LiteralPath $f)) { throw "latest.yml apunta a $f pero no existe" }
          }
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$ver" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME no coincide con package.json v$ver" }
          Write-Output "OK: $path y su .blockmap existen; tag $env:GITHUB_REF_NAME = v$ver"

      # Publica los 3 archivos (.exe, .blockmap, latest.yml) en UNA sola llamada a la API, sobre el
      # Release ya resuelto por tag una única vez — de ahí lee electron-updater para ofrecer la
      # actualización a las instalaciones existentes.
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
