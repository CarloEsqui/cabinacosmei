name: Build Windows installer

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Al empujar un tag v*, además de generar el .exe se publica como GitHub Release —
      # de ahí lee electron-updater para ofrecer la actualización a las instalaciones existentes.
      - name: Compilar y publicar release
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run build && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar sin publicar (ejecución manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: cabina-dashboard-windows
          path: release/*.exe
